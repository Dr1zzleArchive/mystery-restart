name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css *.js _site/
          cp -r assets _site/
          VERSION="${GITHUB_SHA:0:7}"
          sed -i "s/\.js\"/\.js?v=$VERSION\"/g; s/\.css\"/\.css?v=$VERSION\"/g" _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 默认 10 分钟；GitHub Pages 的 syncing_files 偶发会超过 10 分钟，
          # 提前中止会把站点卡在 errored 状态。放宽到 20 分钟避免误杀。
          timeout: 1200000
