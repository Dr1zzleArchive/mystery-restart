name: Deploy to Tencent Cloud COS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cos-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check COS secrets
        id: check
        run: |
          if [ -z "${{ secrets.COS_BUCKET }}" ] || [ -z "${{ secrets.COS_REGION }}" ] || [ -z "${{ secrets.COS_SECRET_ID }}" ] || [ -z "${{ secrets.COS_SECRET_KEY }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "腾讯云 COS 密钥未配置，跳过国内部署（先按 deploy/COS_SETUP.md 配置）。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Build static site
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p _site
          cp index.html styles.css *.js _site/
          cp -r assets _site/
          VERSION="${GITHUB_SHA:0:7}"
          sed -i "s/\.js\"/\.js?v=$VERSION\"/g; s/\.css\"/\.css?v=$VERSION\"/g" _site/index.html

      - name: Install coscli
        if: steps.check.outputs.skip != 'true'
        run: |
          curl -fsSL -o /usr/local/bin/coscli "https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64"
          chmod +x /usr/local/bin/coscli
          coscli --version

      - name: Configure coscli
        if: steps.check.outputs.skip != 'true'
        run: |
          cat > ~/.cos.yaml <<EOF
          cos:
            base:
              secretid: "${{ secrets.COS_SECRET_ID }}"
              secretkey: "${{ secrets.COS_SECRET_KEY }}"
              protocol: https
              disableencryption: "true"
            buckets:
              - name: "${{ secrets.COS_BUCKET }}"
                alias: site
                region: "${{ secrets.COS_REGION }}"
                endpoint: "cos.${{ secrets.COS_REGION }}.myqcloud.com"
          EOF

      - name: Sync to COS
        if: steps.check.outputs.skip != 'true'
        run: |
          coscli sync ./_site cos://site/ -r --delete --force
          coscli cp ./_site/index.html cos://site/index.html --meta "Cache-Control:no-cache"
          echo "已同步到 COS 桶：${{ secrets.COS_BUCKET }}（${{ secrets.COS_REGION }}）"
